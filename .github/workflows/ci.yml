name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: E2E tests
        run: node scripts/e2e-runner.mjs

      - name: Smoke tests
        run: node scripts/smoke-runner.mjs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Build (unpacked)
        run: bun run dist:dir

      - name: Smoke test packaged app
        run: node scripts/smoke-runner.mjs release/win-unpacked/VoiceTweaker.exe

      - name: Build installer and publish draft release
        run: bun run dist --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
